:root{--ink:#131210;--ink2:#1b1916;--line:#2f2b26;--paper:#f1eadb;--red:#ff5a47;--muted:#8f8677}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0a09;color:var(--paper);font-family:PS,monospace;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px;
  background:radial-gradient(circle at 50% 40%,#1d1a16 0,#0b0a09 70%)}
#stage{position:relative;width:min(96vw,calc((100vh - 60px)*840/620),980px)}
#stage.touch{width:min(96vw,calc((100vh - 250px)*840/620),980px)}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--paper);box-shadow:8px 8px 0 var(--red)}
#top{width:min(96vw,980px);display:flex;justify-content:space-between;font-size:9px;color:var(--muted);letter-spacing:1px}
#top a{color:var(--muted);text-decoration:none}#top a:hover{color:var(--red)}
#pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px;margin-top:6px}
#pad.on{display:grid}
#pad button{font:inherit;font-size:20px;color:var(--paper);background:var(--ink2);border:3px solid var(--paper);border-radius:12px;box-shadow:4px 4px 0 var(--red);touch-action:none}
#pad button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--red);background:var(--red);color:var(--ink)}
#pad .c{border-color:var(--line);box-shadow:none;font-size:9px;color:var(--muted)}

const bugPal=a=>a?{A:C.muted,L:C.muted,G:C.peach,E:C.ink,D:"#b5603c"}:{A:C.muted,L:C.muted,G:C.green,E:C.red,D:"#156b47"};
const SPR={hero:mk(HERO,HERO_PAL,4),heroHit:mk(HERO,Object.fromEntries(Object.keys(HERO_PAL).map(k=>[k,C.paper])),4),
  heroBig:mk(HERO,HERO_PAL,9),
  bugA:mk(BUG_A,bugPal(0),4),bugB:mk(BUG_B,bugPal(0),4),abugA:mk(BUG_A,bugPal(1),4),abugB:mk(BUG_B,bugPal(1),4),
  bigBugA:mk(BUG_A,bugPal(0),7),bigBugB:mk(BUG_B,bugPal(0),7),
  coin:mk(COIN,{Y:C.yellow,y:"#fff1a8",O:"#d9a520"},4),stairs:mk(STAIRS,{B:C.blue,S:C.paper},4),
  heart:mk(HEART,{R:C.red},4),heartOff:mk(HEART,{R:C.line},4)};

// ---------------------------------------------------------------- sound
let actx=null, muted=false;
try{muted=localStorage.getItem("bs-muted")==="1"}catch(e){}
function snd(){document.getElementById("snd").textContent="M: SOUND "+(muted?"OFF":"ON")}snd();
function beep(f,d,type="square",v=.07,slide=0,at=0){if(muted)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const t=actx.currentTime+at,o=actx.createOscillator(),a=actx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(a).connect(actx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const SFX={step:()=>beep(220,.05,"square",.03),bonk:()=>beep(90,.12,"square",.06,-40),
  squash:()=>{beep(300,.08,"sawtooth",.06,-250);beep(120,.12,"square",.05,-60,.04)},clink:()=>beep(200,.06,"square",.05,120),
  coin:()=>{beep(988,.07,"square",.05);beep(1319,.18,"square",.05,0,.07)},bite:()=>beep(110,.25,"sawtooth",.08,-60),
  stairs:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.12,"square",.05,0,i*.08)),
  over:()=>[392,330,262,196].forEach((f,i)=>beep(f,.25,"triangle",.09,0,i*.2)),
  start:()=>[262,392,523].forEach((f,i)=>beep(f,.1,"square",.05,0,i*.07)),hi:()=>[523,659,784,1047,1319].forEach((f,i)=>beep(f,.12,"square",.05,0,i*.09))};

// ---------------------------------------------------------------- state
let S=null, mode="title", tMode=0, best=0, shake=0, flash=0, banner=null, fx=[], lastInput=0, countdown=9, newBest=false;
try{best=+localStorage.getItem("bs-best")||0}catch(e){}
const key=(x,y)=>x+","+y;

function bfs(sx,sy,walls){const seen=new Set([key(sx,sy)]),q=[[sx,sy]];while(q.length){const[x,y]=q.shift();
  for(const[dx,dy]of Object.values(DIRS)){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&!walls.has(k)&&!seen.has(k)){seen.add(k);q.push([nx,ny])}}}return seen}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function newLevel(){for(;;){const walls=new Set();
  for(let x=0;x<COLS;x++){walls.add(key(x,0));walls.add(key(x,ROWS-1))}for(let y=0;y<ROWS;y++){walls.add(key(0,y));walls.add(key(COLS-1,y))}
  const n=Math.floor((COLS-2)*(ROWS-2)*(.15+Math.min(S.level,6)*.006));for(let i=0;i<n;i++)walls.add(key(ri(2,COLS-3),ri(1,ROWS-2)));
  const hero=[1,ri(1,ROWS-2)],ex=[COLS-2,ri(1,ROWS-2)];walls.delete(key(...hero));walls.delete(key(...ex));
  const reach=bfs(hero[0],hero[1],walls);if(!reach.has(key(...ex)))continue;
  const cand=[...reach].map(k=>k.split(",").map(Number)).filter(([x,y])=>!(x===hero[0]&&y===hero[1])&&!(x===ex[0]&&y===ex[1])&&Math.abs(x-hero[0])+Math.abs(y-hero[1])>3);
  const nb=Math.min(2+S.level,9);if(cand.length<nb+4)continue;cand.sort(()=>Math.random()-.5);
  const armored=Math.max(0,S.level-2);
  S.walls=walls;S.hero={x:hero[0],y:hero[1],rx:hero[0],ry:hero[1],hit:0,face:1};S.exit=ex;
  S.bugs=cand.slice(0,nb).map(([x,y],i)=>({x,y,rx:x,ry:y,hp:i<armored?2:1,hit:0,ph:Math.random()*6}));
  S.coins=cand.slice(nb,nb+4).map(([x,y])=>({x,y,ph:Math.random()*6}));return}}
function newRun(){S={level:1,hp:MAXHP,score:0,turn:0,kills:0};newLevel();mode="play";tMode=0;fx=[];newBest=false;banner={text:"LEVEL 1",t:0};SFX.start()}

function float(x,y,text,col){fx.push({k:"txt",x:BX+x*T+T/2,y:BY+y*T+10,text,col,t:0})}
function burst(x,y,col,n=14){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1.5+Math.random()*3.5;fx.push({k:"p",x:BX+x*T+T/2,y:BY+y*T+T/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,col,t:0,life:28+Math.random()*16})}}

function move(d){
  const h=S.hero,[dx,dy]=DIRS[d],tx=h.x+dx,ty=h.y+dy;if(dx)h.face=dx;S.turn++;
  const bug=S.bugs.find(b=>b.x===tx&&b.y===ty);
  if(S.walls.has(key(tx,ty))){SFX.bonk();shake=4}
  else if(bug){bug.hp--;bug.hit=8;
    if(bug.hp<=0){S.bugs=S.bugs.filter(b=>b!==bug);S.score+=10;S.kills++;SFX.squash();burst(tx,ty,C.green);float(tx,ty,"+10",C.paper);shake=3}
    else{SFX.clink();burst(tx,ty,C.peach,6);float(tx,ty,"CRACK",C.peach)}}
  else{h.x=tx;h.y=ty;SFX.step();
    const ci=S.coins.findIndex(c=>c.x===tx&&c.y===ty);
    if(ci>=0){S.coins.splice(ci,1);S.score+=5;SFX.coin();float(tx,ty,"+5",C.yellow);burst(tx,ty,C.yellow,8)}
    if(tx===S.exit[0]&&ty===S.exit[1]){S.level++;S.score+=25;S.hp=Math.min(MAXHP,S.hp+1);SFX.stairs();newLevel();banner={text:"LEVEL "+S.level,t:0};flash=10;return}}
  // bugs' turn
  let bites=0;const taken=new Set(S.bugs.map(b=>key(b.x,b.y)));
  for(const b of S.bugs){const dist=Math.abs(b.x-h.x)+Math.abs(b.y-h.y);
    if(dist===1){if(Math.random()<.55)bites++;continue}
    let steps=Object.values(DIRS).sort(()=>Math.random()-.5);
    if(dist<=6)steps.sort((a,c)=>(Math.abs(b.x+a[0]-h.x)+Math.abs(b.y+a[1]-h.y))-(Math.abs(b.x+c[0]-h.x)+Math.abs(b.y+c[1]-h.y)));
    else if(Math.random()<.5)continue;
    for(const[vx,vy]of steps){const nx=b.x+vx,ny=b.y+vy,k=key(nx,ny);
      if(S.walls.has(k)||taken.has(k)||(nx===h.x&&ny===h.y)||(nx===S.exit[0]&&ny===S.exit[1]))continue;
      if(dist<=6&&Math.abs(nx-h.x)+Math.abs(ny-h.y)>=dist)break;
      taken.delete(key(b.x,b.y));b.x=nx;b.y=ny;taken.add(k);break}}
  if(bites){S.hp-=bites;h.hit=14;shake=10;SFX.bite();float(h.x,h.y,"-"+bites+" HP",C.red)}
  if(S.hp<=0){S.hp=0;mode="dead";tMode=0;countdown=9;
    if(S.score>best){best=S.score;newBest=true;try{localStorage.setItem("bs-best",best)}catch(e){}setTimeout(SFX.hi,900)}
    SFX.over();burst(h.x,h.y,C.red,30)}
}

// ---------------------------------------------------------------- input
function input(d){const now=performance.now();
  if(actx&&actx.state==="suspended")actx.resume();
  if(mode==="title"){if(now-lastInput>150){newRun();lastInput=now}return}
  if(mode==="dead"){if(tMode>50&&now-lastInput>150){newRun();lastInput=now}return}
  if(d==="start"||!DIRS[d])return;if(banner&&banner.t<10)return;if(now-lastInput<85)return;lastInput=now;move(d)}
const KEYS={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right",k:"up",j:"down",h:"left",l:"right",Enter:"start"," ":"start"};
addEventListener("keydown",e=>{if(e.key==="m"||e.key==="M"){muted=!muted;try{localStorage.setItem("bs-muted",muted?"1":"0")}catch(_){}snd();return}
  const d=KEYS[e.key];if(d){e.preventDefault();input(d)}});
document.querySelectorAll("#pad button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();input(b.dataset.d)}));
let sx=null,sy=null;cv.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY});
cv.addEventListener("pointerup",e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){input("start");return}input(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"))});
document.getElementById("snd").addEventListener("click",()=>{muted=!muted;try{localStorage.setItem("bs-muted",muted?"1":"0")}catch(_){}snd()});
if(matchMedia("(pointer:coarse)").matches){document.getElementById("pad").classList.add("on");document.getElementById("stage").classList.add("touch")}

// ---------------------------------------------------------------- drawing
function txt(s,x,y,size,col,align="left",font="PS"){g.font=`${size}px ${font}`;g.fillStyle=col;g.textAlign=align;g.textBaseline="alphabetic";g.fillText(s,x,y)}
function bg(){g.fillStyle=C.ink;g.fillRect(0,0,W,H);g.fillStyle="rgba(241,234,219,.04)";for(let y=4;y<H;y+=8)for(let x=4;x<W;x+=8)g.fillRect(x-1,y-1,2,2)}
function scan(){g.fillStyle="rgba(0,0,0,.18)";for(let y=0;y<H;y+=4)g.fillRect(0,y,W,1)}
const fmt=(n,l=5)=>String(n).padStart(l,"0");

function drawHUD(){txt("LV",24,28,10,C.red);txt(String(S.level).padStart(2,"0"),24,60,22,C.paper);
  txt("HP",112,28,10,C.red);for(let i=0;i<MAXHP;i++)g.drawImage(i<S.hp?SPR.heart:SPR.heartOff,112+i*34,38);
  txt("SCORE",320,28,10,C.red);txt(fmt(S.score),320,60,22,C.paper);
  txt("BEST",520,28,10,C.yellow);txt(fmt(Math.max(best,S.score)),520,60,22,C.yellow);
  txt("BUGS "+S.bugs.length,W-24,32,10,C.muted,"right");txt("TURN "+S.turn,W-24,58,10,C.muted,"right")}

function drawBoard(time){
  g.fillStyle=C.red;g.fillRect(BX-6,BY-6,COLS*T+12,ROWS*T+12);g.fillStyle=C.ink2;g.fillRect(BX,BY,COLS*T,ROWS*T);
  g.fillStyle="rgba(241,234,219,.035)";for(let y=BY+4;y<BY+ROWS*T;y+=8)for(let x=BX+4;x<BX+COLS*T;x+=8)g.fillRect(x-1,y-1,2,2);
  for(const k of S.walls){const[x,y]=k.split(",").map(Number),X=BX+x*T,Y=BY+y*T;g.fillStyle=C.wall;g.fillRect(X,Y,T,T);g.fillStyle=C.wallTop;g.fillRect(X,Y,T,4);
    g.fillStyle=C.ink;g.fillRect(X,Y+18,T,2);g.fillRect(X,Y+36,T,2);g.fillRect(X+27,Y+4,2,14);g.fillRect(X+13,Y+20,2,16);g.fillRect(X+41,Y+20,2,16);g.fillRect(X+27,Y+38,2,18)}
  const[ex,ey]=S.exit;g.globalAlpha=.22+.18*Math.sin(time/250);g.fillStyle=C.blue;g.fillRect(BX+ex*T+2,BY+ey*T+2,T-4,T-4);g.globalAlpha=1;
  g.drawImage(SPR.stairs,BX+ex*T+8,BY+ey*T+8);
  for(const c of S.coins){const s=Math.abs(Math.cos(time/300+c.ph)),w=32*Math.max(.15,s);g.drawImage(SPR.coin,BX+c.x*T+28-w/2,BY+c.y*T+12+Math.sin(time/400+c.ph)*2,w,32)}
  for(const b of S.bugs){b.rx+=(b.x-b.rx)*.3;b.ry+=(b.y-b.ry)*.3;const fr=Math.floor(time/220+b.ph)%2,
      sp=b.hp>1?(fr?SPR.abugA:SPR.abugB):(fr?SPR.bugA:SPR.bugB),j=b.hit>0?(Math.random()-.5)*6:0;
    if(b.hit>0)b.hit--;g.drawImage(sp,BX+b.rx*T+4+j,BY+b.ry*T+4)}
  const h=S.hero;h.rx+=(h.x-h.rx)*.35;h.ry+=(h.y-h.ry)*.35;const bob=Math.floor(time/400)%2?-3:0;
  if(mode!=="dead"||tMode<6){g.save();const X=BX+h.rx*T+4,Y=BY+h.ry*T+4+bob;
    if(h.face<0){g.translate(X+48,Y);g.scale(-1,1);g.drawImage(h.hit>0&&h.hit%4<2?SPR.heroHit:SPR.hero,0,0)}else g.drawImage(h.hit>0&&h.hit%4<2?SPR.heroHit:SPR.hero,X,Y);g.restore()}
  if(h.hit>0)h.hit--}

function drawFx(){fx=fx.filter(f=>{f.t++;if(f.k==="p"){f.x+=f.vx;f.y+=f.vy;f.vy+=.18;g.globalAlpha=Math.max(0,1-f.t/f.life);g.fillStyle=f.col;g.fillRect(f.x-3,f.y-3,6,6);g.globalAlpha=1;return f.t<f.life}
  g.globalAlpha=Math.max(0,1-f.t/40);txt(f.text,f.x,f.y-f.t*.8,12,f.col,"center");g.globalAlpha=1;return f.t<40})}

function drawMsg(time){g.fillStyle=C.ink2;g.fillRect(0,H-34,W,34);g.fillStyle=C.line;g.fillRect(0,H-34,W,2);
  if(Math.floor(time/500)%2)txt(">",20,H-12,10,C.red);
  txt(mode==="play"?"SQUASH BUGS · GRAB COINS · TAKE THE STAIRS":"",38,H-12,9,C.paper2);txt("ARROWS / WASD / SWIPE",W-20,H-12,9,C.muted,"right")}

function drawTitle(time){bg();
  txt("ABHISHIV17 PRESENTS",W/2,74,11,C.muted,"center");
  g.font="96px Dela";g.textAlign="center";g.fillStyle=C.red;g.fillText("BUG",W/2+6,196);g.fillStyle=C.paper;g.fillText("BUG",W/2,190);
  g.fillStyle=C.red;g.fillText("SLAYER",W/2+6,296);g.fillStyle=C.paper;g.fillText("SLAYER",W/2,290);
  g.drawImage(SPR.heroBig,64,392+(Math.floor(time/400)%2?-6:0));
  const wx=Math.sin(time/700)*30,f=Math.floor(time/220)%2;g.drawImage(f?SPR.bigBugA:SPR.bigBugB,640+wx,388);g.drawImage(f?SPR.bigBugB:SPR.bigBugA,700-wx,470);
  txt("A TINY ROGUELIKE · SQUASH BUGS · GRAB COINS · TAKE THE STAIRS",W/2,350,9,C.paper2,"center");
  if(Math.floor(time/550)%2)txt("PRESS START",W/2,430,22,C.red,"center");
  txt(matchMedia("(pointer:coarse)").matches?"TAP OR SWIPE TO PLAY":"ENTER / SPACE / ANY ARROW",W/2,466,10,C.muted,"center");
  if(best)txt("BEST "+fmt(best),W/2,520,12,C.yellow,"center");
  txt("M  TOGGLE SOUND",W/2,H-30,9,C.muted,"center");scan()}

function drawBanner(){if(!banner)return;banner.t++;const t=banner.t;if(t>70){banner=null;return}
  const a=t<8?t/8:t>55?(70-t)/15:1;g.globalAlpha=a*.9;g.fillStyle=C.ink;g.fillRect(0,250,W,110);g.globalAlpha=a;g.fillStyle=C.red;g.fillRect(0,250,W,4);g.fillRect(0,356,W,4);
  g.font="64px Dela";g.textAlign="center";g.fillStyle=C.red;g.fillText(banner.text,W/2+4,334);g.fillStyle=C.paper;g.fillText(banner.text,W/2,330);
  txt(S.level===1?"GET READY":"+25 · +1 HP · MORE BUGS",W/2,282,10,C.yellow,"center");g.globalAlpha=1}

function drawDead(time){tMode++;if(tMode<30)return;const a=Math.min(1,(tMode-30)/20);g.globalAlpha=a*.86;g.fillStyle=C.ink;g.fillRect(0,0,W,H);g.globalAlpha=a;
  g.font="80px Dela";g.textAlign="center";g.fillStyle=C.red;g.fillText("GAME OVER",W/2+5,205);g.fillStyle=C.paper;g.fillText("GAME OVER",W/2,200);
  txt("SCORE "+fmt(S.score)+"   ·   LEVEL "+S.level+"   ·   "+S.kills+" BUGS",W/2,250,12,C.paper2,"center");
  if(newBest&&Math.floor(time/300)%2)txt("NEW HI-SCORE!",W/2,292,16,C.yellow,"center");
  txt("CONTINUE?",W/2,360,18,C.paper,"center");
  if(tMode>50){const s=Math.floor((tMode-50)/60);countdown=Math.max(0,9-s);if(countdown===0&&tMode>50+600){mode="title";tMode=0}}
  txt(String(countdown),W/2,440,56,C.yellow,"center");
  if(Math.floor(time/500)%2)txt("PRESS ANY KEY",W/2,490,12,C.red,"center");g.globalAlpha=1}

function frame(time){
  if(mode==="title"){drawTitle(time);requestAnimationFrame(frame);return}
  g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.4)shake=0}
  bg();drawHUD();drawBoard(time);drawFx();g.restore();drawMsg(time);
  if(flash>0){g.globalAlpha=flash/14;g.fillStyle=C.paper;g.fillRect(0,0,W,H);g.globalAlpha=1;flash--}
  if(S.hero.hit>10){g.globalAlpha=.18;g.fillStyle=C.red;g.fillRect(0,0,W,H);g.globalAlpha=1}
  drawBanner();if(mode==="dead")drawDead(time);scan();requestAnimationFrame(frame)}
document.fonts.load("20px PS").then(()=>document.fonts.load("20px Dela")).finally(()=>requestAnimationFrame(frame));
</script>
</body>
